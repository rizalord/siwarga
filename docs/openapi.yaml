      schema:
        type: integer
    PermissionId:
      name: permission
      in: path
      required: true
      schema:
        type: integer

  requestBodies:
    BulkIds:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [ids]
            properties:
              ids:
                type: array
                minItems: 1
                items:
                  type: integer

  responses:
    Message:
      description: Success message
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
    UnprocessableMessage:
      description: Request could not be processed (business rule violation)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"

  schemas:
    MessageResponse:
      type: object
      properties:
        data:
          type: object
          nullable: true
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        message:
          type: string

    ValidationErrorResponse:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    LaravelPaginated:
      description: Default Laravel paginator JSON shape (used by Users, Roles, Permissions endpoints)
      type: object
      properties:
        data:
          type: array
          items: {}
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
