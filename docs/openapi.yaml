      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  maxLength: 255
                title:
                  type: string
                  maxLength: 255
                  nullable: true
      responses:
        "200":
          description: Tracked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    nullable: true

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "Laravel Sanctum token"
      description: >
        Obtain via POST /auth/login. Pass as `Authorization: Bearer <token>`.
        Tokens expire 24 hours after issuance.

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        default: 10
    Search:
      name: search
      in: query
      schema:
        type: string
    Sort:
      name: sort
      in: query
      description: Column to sort by (whitelisted per resource)
      schema:
        type: string
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    Trashed:
      name: trashed
      in: query
      description: "`with` includes soft-deleted rows, `only` returns only soft-deleted rows"
      schema:
        type: string
        enum: [with, only]
    ResidentId:
      name: resident
      in: path
      required: true
      schema:
        type: integer
    HouseId:
      name: house
      in: path
      required: true
      schema:
        type: integer
    DueTypeId:
      name: dueType
      in: path
      required: true
      schema:
        type: integer
    ExpenseCategoryId:
      name: expenseCategory
      in: path
      required: true
      schema:
        type: integer
    BillId:
      name: bill
      in: path
      required: true
      schema:
        type: integer
    PaymentId:
      name: payment
      in: path
      required: true
      schema:
        type: integer
    ExpenseId:
      name: expense
      in: path
      required: true
