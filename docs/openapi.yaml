openapi: 3.0.3
info:
  title: SIWarga API
  description: >
    API for SIWarga, an RT (neighborhood association) administration system:
    residents, houses, monthly dues (iuran), bills, payments, expenses,
    users/roles/permissions (RBAC), activity logs, and financial reports.
  version: "1.0.0"
servers:
  - url: http://localhost:8000/api
    description: Local development

tags:
  - name: Auth
  - name: Residents
  - name: Houses
  - name: Due Types
  - name: Expense Categories
  - name: Bills
  - name: Payments
  - name: Expenses
  - name: Reports
  - name: Users
  - name: Roles
  - name: Permissions
  - name: Activity Logs

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and obtain an API token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@siwarga.test
                password:
                  type: string
                  format: password
                  example: password
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                      token:
                        type: string
                      permissions:
                        type: array
                        items:
                          type: string
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current access token
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Revoke the current token and issue a new one
      responses:
        "200":
          description: New token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the authenticated user, roles, permissions
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                      permissions:
                        type: array
                        items:
                          type: string

  # ---------------------------------------------------------------- Residents
  /residents:
    get:
      tags: [Residents]
      summary: List residents
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
        - $ref: "#/components/parameters/Trashed"
        - name: status
          in: query
          schema:
            oneOf:
              - type: string
                enum: [kontrak, tetap]
              - type: array
                items:
                  type: string
                  enum: [kontrak, tetap]
        - name: marital_status
          in: query
          schema:
            oneOf:
              - type: string
                enum: [menikah, belum_menikah]
              - type: array
                items:
                  type: string
                  enum: [menikah, belum_menikah]
      responses:
        "200":
          description: Paginated list of residents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentPaginated"
    post:
      tags: [Residents]
      summary: Create a resident
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [full_name, status, phone_number, marital_status]
              properties:
                full_name:
                  type: string
                  maxLength: 150
                status:
                  type: string
                  enum: [kontrak, tetap]
                phone_number:
                  type: string
                  maxLength: 20
                marital_status:
                  type: string
                  enum: [menikah, belum_menikah]
                ktp_photo:
                  type: string
                  format: binary
      responses:
        "201":
          description: Resident created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"

  /residents/bulk-delete:
    post:
      tags: [Residents]
      summary: Bulk delete residents (skips residents currently housed)
      requestBody:
        $ref: "#/components/requestBodies/BulkIds"
      responses:
        "200":
          description: All requested residents deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "207":
          description: Partial success — some residents could not be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /residents/bulk-restore:
    post:
      tags: [Residents]
      summary: Bulk restore soft-deleted residents
      requestBody:
        $ref: "#/components/requestBodies/BulkIds"
      responses:
        "200":
          $ref: "#/components/responses/Message"

  /residents/bulk-force-delete:
    post:
      tags: [Residents]
      summary: Bulk permanently delete soft-deleted residents
      requestBody:
        $ref: "#/components/requestBodies/BulkIds"
      responses:
        "200":
          $ref: "#/components/responses/Message"

  /residents/{resident}/restore:
    post:
      tags: [Residents]
      summary: Restore a soft-deleted resident
      parameters:
        - $ref: "#/components/parameters/ResidentId"
      responses:
        "200":
          description: Resident restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentEnvelope"

  /residents/{resident}/force-delete:
    delete:
      tags: [Residents]
      summary: Permanently delete a soft-deleted resident
      parameters:
        - $ref: "#/components/parameters/ResidentId"
      responses:
        "200":
          $ref: "#/components/responses/Message"

  /residents/{resident}:
    get:
      tags: [Residents]
      summary: Get a resident
      parameters:
        - $ref: "#/components/parameters/ResidentId"
      responses:
        "200":
          description: Resident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Residents]
      summary: Update a resident
      parameters:
        - $ref: "#/components/parameters/ResidentId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  maxLength: 150
                status:
                  type: string
                  enum: [kontrak, tetap]
                phone_number:
                  type: string
                  maxLength: 20
                marital_status:
                  type: string
                  enum: [menikah, belum_menikah]
                ktp_photo:
                  type: string
                  format: binary
      responses:
        "200":
          description: Resident updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Residents]
      summary: Delete a resident (fails if currently housed)
      parameters:
        - $ref: "#/components/parameters/ResidentId"
      responses:
        "200":
          $ref: "#/components/responses/Message"
        "422":
          $ref: "#/components/responses/UnprocessableMessage"

  # -------------------------------------------------------------------- Houses
  /houses:
    get:
      tags: [Houses]
      summary: List houses
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
        - $ref: "#/components/parameters/Trashed"
        - name: status
          in: query
          schema:
            oneOf:
              - type: string
                enum: [dihuni, kosong]
              - type: array
                items:
                  type: string
                  enum: [dihuni, kosong]
      responses:
        "200":
          description: Paginated list of houses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousePaginated"
    post:
      tags: [Houses]
      summary: Create a house
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [house_number]
              properties:
                house_number:
                  type: string
                  maxLength: 20
                address:
                  type: string
                  maxLength: 255
                  nullable: true
                status:
                  type: string
                  enum: [dihuni, kosong]
      responses:
        "201":
          description: House created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"

  /houses/bulk-delete:
    post:
      tags: [Houses]
      summary: Bulk delete houses (skips houses with bill history)
      requestBody:
        $ref: "#/components/requestBodies/BulkIds"
      responses:
        "200":
          description: All requested houses deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "207":
          description: Partial success — some houses could not be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /houses/bulk-restore:
    post:
      tags: [Houses]
      summary: Bulk restore soft-deleted houses
      requestBody:
        $ref: "#/components/requestBodies/BulkIds"
      responses:
        "200":
          $ref: "#/components/responses/Message"

  /houses/bulk-force-delete:
    post:
      tags: [Houses]
      summary: Bulk permanently delete soft-deleted houses
      requestBody:
        $ref: "#/components/requestBodies/BulkIds"
      responses:
        "200":
          $ref: "#/components/responses/Message"

  /houses/{house}/restore:
    post:
      tags: [Houses]
      summary: Restore a soft-deleted house
      parameters:
        - $ref: "#/components/parameters/HouseId"
      responses:
        "200":
          description: House restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseEnvelope"

  /houses/{house}/force-delete:
    delete:
      tags: [Houses]
      summary: Permanently delete a soft-deleted house
      parameters:
        - $ref: "#/components/parameters/HouseId"
      responses:
        "200":
          $ref: "#/components/responses/Message"

  /houses/{house}:
    get:
      tags: [Houses]
      summary: Get a house
      parameters:
        - $ref: "#/components/parameters/HouseId"
      responses:
        "200":
          description: House
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Houses]
      summary: Update a house
      parameters:
        - $ref: "#/components/parameters/HouseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                house_number:
                  type: string
                  maxLength: 20
                address:
                  type: string
                  maxLength: 255
                  nullable: true
                status:
                  type: string
                  enum: [dihuni, kosong]
      responses:
        "200":
          description: House updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Houses]
      summary: Delete a house (fails if it has bill history)
      parameters:
        - $ref: "#/components/parameters/HouseId"
      responses:
        "200":
          $ref: "#/components/responses/Message"
        "422":
          $ref: "#/components/responses/UnprocessableMessage"

  /houses/{house}/history:
    get:
      tags: [Houses]
      summary: Get the resident-occupancy history for a house
      parameters:
        - $ref: "#/components/parameters/HouseId"
      responses:
        "200":
          description: House-resident assignment history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/HouseResident"

  /houses/{house}/assign-resident:
    post:
      tags: [Houses]
      summary: Assign a resident to a house
      parameters:
        - $ref: "#/components/parameters/HouseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resident_id, start_date]
              properties:
                resident_id:
                  type: integer
                start_date:
                  type: string
                  format: date
                end_date:
                  type: string
                  format: date
                  nullable: true
      responses:
        "201":
          description: Resident assigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/HouseResident"
        "422":
          $ref: "#/components/responses/ValidationError"

  /houses/{house}/vacate-resident:
    post:
      tags: [Houses]
      summary: Vacate the current resident from a house
      parameters:
        - $ref: "#/components/parameters/HouseId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                end_date:
                  type: string
                  format: date
                  nullable: true
      responses:
        "200":
          $ref: "#/components/responses/Message"
        "422":
          $ref: "#/components/responses/UnprocessableMessage"

  # ----------------------------------------------------------------- Due Types
  /due-types:
    get:
      tags: [Due Types]
      summary: List due types
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
        - $ref: "#/components/parameters/Trashed"
      responses:
        "200":
          description: Paginated list of due types
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DueTypePaginated"
    post:
      tags: [Due Types]
      summary: Create a due type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, amount]
              properties:
                name:
                  type: string
                  maxLength: 50
                amount:
                  type: number
                  format: float
                  minimum: 0
                billing_cycle:
                  type: string
                  enum: [bulanan, fleksibel]
      responses:
        "201":
          description: Due type created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DueTypeEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"

  /due-types/bulk-delete:
    post:
      tags: [Due Types]
      summary: Bulk delete due types
      requestBody:
        $ref: "#/components/requestBodies/BulkIds"
      responses:
        "200":
          $ref: "#/components/responses/Message"

  /due-types/bulk-restore:
    post:
      tags: [Due Types]
      summary: Bulk restore soft-deleted due types
      requestBody:
        $ref: "#/components/requestBodies/BulkIds"
      responses:
        "200":
          $ref: "#/components/responses/Message"

  /due-types/bulk-force-delete:
    post:
      tags: [Due Types]
      summary: Bulk permanently delete soft-deleted due types
      requestBody:
        $ref: "#/components/requestBodies/BulkIds"
      responses:
        "200":
          $ref: "#/components/responses/Message"

  /due-types/{dueType}/restore:
    post:
      tags: [Due Types]
      summary: Restore a soft-deleted due type
      parameters:
        - $ref: "#/components/parameters/DueTypeId"
      responses:
        "200":
          description: Due type restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DueTypeEnvelope"

  /due-types/{dueType}/force-delete:
    delete:
      tags: [Due Types]
      summary: Permanently delete a soft-deleted due type
      parameters:
        - $ref: "#/components/parameters/DueTypeId"
      responses:
        "200":
          $ref: "#/components/responses/Message"

  /due-types/{dueType}:
    get:
      tags: [Due Types]
      summary: Get a due type
      parameters:
        - $ref: "#/components/parameters/DueTypeId"
      responses:
        "200":
          description: Due type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DueTypeEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Due Types]
      summary: Update a due type
      parameters:
        - $ref: "#/components/parameters/DueTypeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 50
                amount:
                  type: number
                  format: float
                  minimum: 0
                billing_cycle:
                  type: string
                  enum: [bulanan, fleksibel]
      responses:
        "200":
          description: Due type updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DueTypeEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Due Types]
      summary: Delete a due type
      parameters:
        - $ref: "#/components/parameters/DueTypeId"
      responses:
        "200":
          $ref: "#/components/responses/Message"

  # ---------------------------------------------------------- Expense Categories
  /expense-categories:
    get:
      tags: [Expense Categories]
      summary: List expense categories
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
        - $ref: "#/components/parameters/Trashed"
      responses:
        "200":
          description: Paginated list of expense categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseCategoryPaginated"
    post:
      tags: [Expense Categories]
      summary: Create an expense category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 100
      responses:
        "201":
          description: Expense category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseCategoryEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"

  /expense-categories/bulk-delete:
    post:
      tags: [Expense Categories]
      summary: Bulk delete expense categories
      requestBody:
        $ref: "#/components/requestBodies/BulkIds"
      responses:
        "200":
          $ref: "#/components/responses/Message"

  /expense-categories/bulk-restore:
    post:
      tags: [Expense Categories]
      summary: Bulk restore soft-deleted expense categories
      requestBody:
        $ref: "#/components/requestBodies/BulkIds"
      responses:
        "200":
          $ref: "#/components/responses/Message"

  /expense-categories/bulk-force-delete:
    post:
      tags: [Expense Categories]
      summary: Bulk permanently delete soft-deleted expense categories
      requestBody:
        $ref: "#/components/requestBodies/BulkIds"
      responses:
        "200":
          $ref: "#/components/responses/Message"

  /expense-categories/{expenseCategory}/restore:
    post:
      tags: [Expense Categories]
      summary: Restore a soft-deleted expense category
      parameters:
        - $ref: "#/components/parameters/ExpenseCategoryId"
      responses:
        "200":
          description: Expense category restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseCategoryEnvelope"

  /expense-categories/{expenseCategory}/force-delete:
    delete:
      tags: [Expense Categories]
      summary: Permanently delete a soft-deleted expense category
      parameters:
        - $ref: "#/components/parameters/ExpenseCategoryId"
      responses:
        "200":
          $ref: "#/components/responses/Message"

  /expense-categories/{expenseCategory}:
    get:
      tags: [Expense Categories]
      summary: Get an expense category
      parameters:
        - $ref: "#/components/parameters/ExpenseCategoryId"
      responses:
        "200":
          description: Expense category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseCategoryEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Expense Categories]
      summary: Update an expense category
      parameters:
        - $ref: "#/components/parameters/ExpenseCategoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 100
      responses:
        "200":
          description: Expense category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseCategoryEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Expense Categories]
      summary: Delete an expense category
      parameters:
        - $ref: "#/components/parameters/ExpenseCategoryId"
      responses:
        "200":
          $ref: "#/components/responses/Message"

  # -------------------------------------------------------------------- Bills
  /bills:
    get:
      tags: [Bills]
      summary: List bills (Warga users only see their own)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
        - $ref: "#/components/parameters/Trashed"
        - name: month
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - name: year
          in: query
          schema:
            type: integer
        - name: due_type_id
          in: query
          schema:
            oneOf:
              - type: integer
              - type: array
                items:
                  type: integer
        - name: status
          in: query
          schema:
            oneOf:
              - type: string
                enum: [belum_lunas, lunas]
              - type: array
                items:
                  type: string
                  enum: [belum_lunas, lunas]
      responses:
        "200":
          description: Paginated list of bills
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillPaginated"

  /bills/generate:
    post:
      tags: [Bills]
      summary: Generate monthly bills for all occupied houses (idempotent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [month, year]
              properties:
                month:
                  type: integer
                  minimum: 1
                  maximum: 12
                year:
                  type: integer
                  minimum: 2020
      responses:
        "201":
          description: Bills generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Bill"
                  message:
                    type: string
        "422":
          $ref: "#/components/responses/ValidationError"

  /bills/bulk-delete:
    post:
      tags: [Bills]
      summary: Bulk delete bills
      requestBody:
        $ref: "#/components/requestBodies/BulkIds"
      responses:
        "200":
          $ref: "#/components/responses/Message"

  /bills/bulk-restore:
    post:
      tags: [Bills]
      summary: Bulk restore soft-deleted bills
      requestBody:
        $ref: "#/components/requestBodies/BulkIds"
      responses:
        "200":
          $ref: "#/components/responses/Message"

  /bills/bulk-force-delete:
    post:
      tags: [Bills]
      summary: Bulk permanently delete soft-deleted bills
      requestBody:
        $ref: "#/components/requestBodies/BulkIds"
      responses:
        "200":
          $ref: "#/components/responses/Message"

  /bills/{bill}/restore:
    post:
      tags: [Bills]
      summary: Restore a soft-deleted bill
      parameters:
        - $ref: "#/components/parameters/BillId"
      responses:
