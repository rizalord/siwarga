<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — SIWarga</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        background: #ffffff;
        color: #166534;
        text-align: center;
        padding: 1.5rem;
      }
      main {
        max-width: 28rem;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
      }
      p {
        color: #444;
      }
      button {
        margin-top: 1rem;
        padding: 0.6rem 1.2rem;
        border: none;
        border-radius: 0.5rem;
        background: #166534;
        color: #fff;
        font-size: 1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Anda sedang offline</h1>
      <p>SIWarga membutuhkan koneksi internet.</p>
      <button onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
