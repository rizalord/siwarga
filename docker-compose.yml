# Development stack: source code is bind-mounted into backend/frontend
# containers so edits on the host are picked up live (PHP re-interprets on
# every request, Vite hot-reloads the browser).
#
# Usage:
#   cp .env.example .env   # sesuaikan nilainya
#   docker compose up --build

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-siwarga}
      MYSQL_USER: ${DB_USERNAME:-siwarga}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - siwarga_db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    image: siwarga-backend:dev
    restart: unless-stopped
    ports:
      - '${BACKEND_PORT:-8000}:8000'
    environment:
      APP_NAME: ${APP_NAME:-SIWarga}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-siwarga}
      DB_USERNAME: ${DB_USERNAME:-siwarga}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      LOG_CHANNEL: stack
      FTP_INBOX_PATH: ${FTP_INBOX_PATH:-ftp-inbox}
      WAHA_BASE_URL: ${WAHA_BASE_URL:-http://waha:3000}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
    volumes:
      - ./src/backend:/var/www/html
      - siwarga_backend_vendor:/var/www/html/vendor
      - siwarga_ftp_data:/var/www/html/storage/app/public/ftp-inbox:ro
    depends_on:
      db:
        condition: service_healthy

  queue:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    image: siwarga-backend:dev
    restart: unless-stopped
    command: ['php', 'artisan', 'queue:work', '--tries=3', '--sleep=3']
    environment:
      APP_NAME: ${APP_NAME:-SIWarga}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-siwarga}
      DB_USERNAME: ${DB_USERNAME:-siwarga}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      LOG_CHANNEL: stack
      WAHA_BASE_URL: ${WAHA_BASE_URL:-http://waha:3000}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
    volumes:
      - ./src/backend:/var/www/html
      - siwarga_backend_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    image: siwarga-backend:dev
    restart: unless-stopped
    command: ['php', 'artisan', 'schedule:work']
    environment:
      APP_NAME: ${APP_NAME:-SIWarga}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-siwarga}
      DB_USERNAME: ${DB_USERNAME:-siwarga}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      LOG_CHANNEL: stack
      FTP_INBOX_PATH: ${FTP_INBOX_PATH:-ftp-inbox}
    volumes:
      - ./src/backend:/var/www/html
      - siwarga_backend_vendor:/var/www/html/vendor
      - siwarga_ftp_data:/var/www/html/storage/app/public/ftp-inbox:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    image: siwarga-frontend:dev
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-5173}:5173'
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
    volumes:
      - ./src/frontend:/app
      - siwarga_frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    ports:
      - '${WAHA_PORT:-3000}:3000'
    environment:
      WHATSAPP_API_KEY: ${WAHA_API_KEY:-}
      WAHA_NO_API_KEY: ${WAHA_NO_API_KEY:-true}
      WAHA_DASHBOARD_ENABLED: 'true'
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-secret}
      WAHA_PRINT_QR: 'true'
      WHATSAPP_FILES_FOLDER: /app/.media
      WHATSAPP_FILES_LIFETIME: '0'
    volumes:
      - siwarga_waha_sessions:/app/.sessions
      - siwarga_waha_media:/app/.media

  ftp:
    image: stilliard/pure-ftpd:hardened
    restart: unless-stopped
    # Firewall host: buka 21 + FTP_PASV_RANGE. FTPS bila didukung kamera.
    ports:
      - '${FTP_PORT:-21}:21'
      - '${FTP_PASV_RANGE:-30000-30009}:30000-30009'
    environment:
      PUBLICHOST: ${FTP_PUBLICHOST:-localhost}
      FTP_USER_NAME: ${FTP_USER:-cctv-gerbang}
      FTP_USER_PASS: ${FTP_PASS:-change-me}
      FTP_USER_HOME: /home/ftpusers/cctv-gerbang
    volumes:
      - siwarga_ftp_data:/home/ftpusers/

volumes:
  siwarga_db_data:
  siwarga_backend_vendor:
  siwarga_ftp_data:
  siwarga_frontend_node_modules:
  siwarga_waha_sessions:
  siwarga_waha_media:
