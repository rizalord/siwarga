# Production stack: backend serves php-fpm+nginx from a pre-built,
# optimized image; frontend is a static build served by nginx. No bind
# mounts — everything is baked into the images at build time.
#
# Usage:
#   cp .env.example .env   # set APP_KEY dan kredensial production
#   docker compose -f docker-compose.prd.yml up --build -d

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-siwarga}
      MYSQL_USER: ${DB_USERNAME:-siwarga}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    volumes:
      - siwarga_db_data_prd:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile.prd
    image: siwarga-backend:prd
    restart: unless-stopped
    ports:
      - '${BACKEND_PORT:-8000}:80'
    environment:
      APP_NAME: ${APP_NAME:-SIWarga}
      APP_ENV: production
      APP_KEY: ${APP_KEY:?APP_KEY must be set in .env for production}
      APP_DEBUG: 'false'
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-siwarga}
      DB_USERNAME: ${DB_USERNAME:-siwarga}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      LOG_CHANNEL: stack
      WAHA_BASE_URL: ${WAHA_BASE_URL:-http://waha:3000}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      WAHA_API_KEY: ${WAHA_API_KEY:?WAHA_API_KEY must be set in .env for production}
    volumes:
      - siwarga_backend_storage_prd:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile.prd
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
    image: siwarga-frontend:prd
    restart: unless-stopped
    ports:
      - '${FRONTEND_PROD_PORT:-8080}:80'
    depends_on:
      - backend

  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    ports:
      - '${WAHA_PORT:-3000}:3000'
    environment:
      WHATSAPP_API_KEY: ${WAHA_API_KEY:?WAHA_API_KEY must be set in .env for production}
      WAHA_DASHBOARD_ENABLED: 'true'
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:?WAHA_DASHBOARD_USERNAME must be set}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?WAHA_DASHBOARD_PASSWORD must be set}
      WAHA_PRINT_QR: 'false'
      WHATSAPP_FILES_FOLDER: /app/.media
      WHATSAPP_FILES_LIFETIME: '0'
    volumes:
      - siwarga_waha_sessions_prd:/app/.sessions
      - siwarga_waha_media_prd:/app/.media

volumes:
  siwarga_db_data_prd:
  siwarga_backend_storage_prd:
  siwarga_waha_sessions_prd:
  siwarga_waha_media_prd:
